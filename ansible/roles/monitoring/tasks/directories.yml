- name: Create monitoring root directory
  ansible.builtin.file:
    path: "{{ monitoring_base_dir }}"
    state: directory
    owner: root
    group: "{{ monitoring_config_group }}"
    mode: "0755"

- name: Create monitoring configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ monitoring_config_group }}"
    mode: "{{ monitoring_config_dir_mode }}"
  loop:
    - "{{ monitoring_config_dir }}"
    - "{{ monitoring_prometheus_config_dir }}"
    - "{{ monitoring_alertmanager_config_dir }}"
    - "{{ monitoring_blackbox_config_dir }}"
    - "{{ monitoring_config_dir }}/grafana"
    - "{{ monitoring_config_dir }}/grafana/provisioning"
    - "{{ monitoring_grafana_provisioning_dir }}"

- name: Create private secrets directory
  ansible.builtin.file:
    path: "{{ monitoring_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Store Grafana administrator password
  ansible.builtin.copy:
    content: "{{ monitoring_grafana_admin_password }}"
    dest: "{{ monitoring_grafana_admin_password_file }}"
    owner: root
    group: root
    mode: "0444"
  no_log: true
  notify: Restart grafana