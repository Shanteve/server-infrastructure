- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present 

- name: Configure Fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Enable Fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true