# GitLab Runner
gitlab_runner_package: gitlab-runner
gitlab_runner_service: gitlab-runner

# GitLab repository
gitlab_runner_repo_script_url: "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh"
gitlab_runner_repo_script_path: /tmp/gitlab-runner-repository.sh
gitlab_runner_repo_file: /etc/apt/sources.list.d/runner_gitlab-runner.list

# Registration
gitlab_runner_url: "https://gitlab.com/"
gitlab_runner_name: "shanteve-vps-docker"
gitlab_runner_token: ""

# Runner configuration
gitlab_runner_config_path: /etc/gitlab-runner/config.toml

gitlab_runner_concurrent: 2
gitlab_runner_limit: 2
gitlab_runner_check_interval: 3

# Docker executor
gitlab_runner_docker_image: "alpine:3.24"
gitlab_runner_docker_host: "unix:///var/run/docker.sock"
gitlab_runner_docker_privileged: false

# Build container resource limits
gitlab_runner_docker_cpus: "1.0"
gitlab_runner_docker_memory: "1500m"

# Docker security
gitlab_runner_docker_security_opt:
  - no-new-privileges:true

# Docker volumes
gitlab_runner_docker_volumes:
  - /cache